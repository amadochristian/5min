<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="rgb(0, 135, 59)">
  <meta name="description" content="Formulários de segurança operacional da Santher.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
  <title>5Minutos para Segurança</title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="#home" aria-label="Ir para o início">
        <span><strong>5Minutos</strong><small>para Segurança</small></span>
      </a>
      <div class="header-tools">
        <span class="connection-status" id="connectionStatus"><i></i><span>Online</span></span>
        <button class="icon-button" id="installButton" type="button" hidden aria-label="Instalar aplicativo" title="Instalar aplicativo">↓</button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a href="#home" data-route="home"><span aria-hidden="true">⌂</span>Início</a>
      <a href="#configuracoes" data-route="configuracoes"><span aria-hidden="true">⚙</span>Ajustes</a>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
